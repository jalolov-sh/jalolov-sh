<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Shakhobiddin Jalolov, full-stack developer from Tashkent, Uzbekistan">
<title>Shakhobiddin Jalolov, full-stack developer from Tashkent, Uzbekistan</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1320"/><stop offset="1" stop-color="#0B1B21"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22B8D6"/><stop offset="1" stop-color="#34D36B"/></linearGradient>
<clipPath id="clip"><rect width="1000" height="340" rx="18"/></clipPath>

<linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#9EEAFF"/><stop offset="1" stop-color="#A6F5C2"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="7s" repeatCount="indefinite"/>
</linearGradient>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#FFF"/></pattern>
<radialGradient id="dotfade" cx=".8" cy=".5" r=".6"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
<mask id="dotmask"><rect width="1000" height="340" fill="url(#dotfade)"/></mask>
</defs>
<style>
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.tw{opacity:.2;animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
.b1{animation:d1 17s ease-in-out infinite alternate}
.b2{animation:d2 21s ease-in-out infinite alternate}
.b3{animation:d3 19s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(180px,70px)}}
@keyframes d2{to{transform:translate(-200px,-60px)}}
@keyframes d3{to{transform:translate(-140px,80px)}}
.spin{transform-origin:800px 170px;animation:spin 48s linear infinite}
.spinr{transform-origin:800px 170px;animation:spin 32s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dash{animation:dash 30s linear infinite}
@keyframes dash{to{stroke-dashoffset:-480}}
.up{opacity:0;animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.role{opacity:0;animation:role 14s infinite}
@keyframes role{0%{opacity:0;transform:translateY(12px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-12px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up{opacity:1}.r1{opacity:1}}
</style>
<g clip-path="url(#clip)"><rect width="1000" height="340" fill="url(#bg)"/>

<rect width="1000" height="340" fill="url(#dots)" opacity=".18" mask="url(#dotmask)"/>
<g filter="url(#blur)" opacity=".5">
<circle class="b1" cx="120" cy="40" r="110" fill="#22B8D6" opacity=".5"/>
<circle class="b2" cx="620" cy="330" r="150" fill="#34D36B" opacity=".45"/>
<circle class="b3" cx="900" cy="30" r="120" fill="#3B6CFF" opacity=".5"/>
</g>
<circle cx="611" cy="65" r="1.3" fill="#FFF" class="tw" style="animation-delay:0.3s;animation-duration:3.8s"/>
<circle cx="635" cy="37" r="1.2" fill="#FFF" class="tw" style="animation-delay:0.1s;animation-duration:3.6s"/>
