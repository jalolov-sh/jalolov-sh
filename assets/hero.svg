<circle cx="589" cy="136" r="1.3" fill="#FFF" class="tw" style="animation-delay:0.1s;animation-duration:3.7s"/>
<circle cx="524" cy="55" r="0.7" fill="#FFF" class="tw" style="animation-delay:3.1s;animation-duration:2.8s"/>
<circle cx="569" cy="137" r="1.6" fill="#FFF" class="tw" style="animation-delay:0.3s;animation-duration:3.6s"/>
<circle cx="800" cy="170" r="150" fill="none" stroke="url(#brand)" stroke-opacity=".4" stroke-dasharray="2 10" class="dash"/>
<circle cx="800" cy="170" r="122" fill="none" stroke="#FFF" stroke-opacity=".06"/>
<g class="spin"><rect x="712.0" y="82.0" width="176" height="176" fill="none" stroke="url(#brand)" stroke-width="1.6"/><rect x="712.0" y="82.0" width="176" height="176" fill="none" stroke="url(#brand)" stroke-width="1.6" transform="rotate(45 800 170)"/></g>
<g class="spinr"><rect x="740.0" y="110.0" width="120" height="120" fill="#22B8D6" fill-opacity=".06" stroke="url(#brand)" stroke-opacity=".7"/><rect x="740.0" y="110.0" width="120" height="120" fill="#22B8D6" fill-opacity=".06" stroke="url(#brand)" stroke-opacity=".7" transform="rotate(45 800 170)"/></g>
<circle cx="800" cy="170" r="46" fill="#0B1726" stroke="url(#brand)" stroke-width="1.6"/>
<text x="800" y="179" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#9EEAFF">&lt;/&gt;</text>
<circle r="4" fill="#34D36B"><animateMotion dur="12s" repeatCount="indefinite" path="M650,170 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/></circle>
<circle r="3" fill="#22B8D6"><animateMotion dur="12s" begin="-6s" repeatCount="indefinite" path="M650,170 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/></circle>
<g class="up" style="animation-delay:.15s"><text x="56" y="86" class="mono" font-size="15" fill="#7FDCF0">// salom, dunyo — hi, I'm</text></g>
<g class="up" style="animation-delay:.3s"><text x="53" y="152" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#name)">Shakhobiddin</text></g>
<g class="up" style="animation-delay:.45s"><text x="53" y="218" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#name)">Jalolov</text></g>
<g class="up" style="animation-delay:.6s"><text x="58" y="262" font-size="20" fill="#34D36B">▸</text><g font-size="20" fill="#D0D7DE"><text class="role r1" x="84" y="262" style="animation-delay:0.0s">React + TypeScript frontends</text>
<text class="role r2" x="84" y="262" style="animation-delay:3.5s">Oracle APEX &amp; PL/SQL backends</text>
<text class="role r3" x="84" y="262" style="animation-delay:7.0s">InsurTech: claims · policies · e-docs</text>
<text class="role r4" x="84" y="262" style="animation-delay:10.5s">A co-op horror game in Unity 6</text></g></g>
<g class="up" style="animation-delay:.75s"><rect x="56" y="284" width="180" height="30" rx="15" fill="#FFF" fill-opacity=".05" stroke="#22B8D6" stroke-opacity=".45"/><circle cx="72" cy="299" r="4" fill="#22B8D6"/><text x="83" y="304" font-size="13" fill="#C9D1D9">Tashkent, Uzbekistan</text><rect x="246" y="284" width="180" height="30" rx="15" fill="#FFF" fill-opacity=".05" stroke="#34D36B" stroke-opacity=".45"/><circle cx="262" cy="299" r="4" fill="#34D36B"/><text x="273" y="304" font-size="13" fill="#C9D1D9">Full-Stack Developer</text><rect x="436" y="284" width="180" height="30" rx="15" fill="#FFF" fill-opacity=".05" stroke="#F5C451" stroke-opacity=".45"/><circle cx="452" cy="299" r="4" fill="#F5C451"/><text x="463" y="304" font-size="13" fill="#C9D1D9">InsurTech · Game dev</text></g>
</g><rect x=".5" y=".5" width="999" height="339" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
